<text x="16" y="26" class="t16">02 Research plan and instruments</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: How did we learn how engagement teams work, with what methods, what rigor and what limits?</tspan></text>
<text x="16" y="66" class="t11 ink2">Feeds: D-02  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="756" y="22">I decided: the method mix, the sampling frame per method and contextual inquiry as the anchor.</tspan></text>
<text class="t11 ink2"><tspan x="756" y="43">We built: the instruments, the recruiting screeners and the SME session series. Fieldwork and coding</tspan><tspan x="756" y="56">were team work. Design team of three at this phase.</tspan></text>
<text x="16" y="92" class="t10 ink2">Reconstructed for portfolio purposes. The process, decisions and role are real. Screens, data, names and figures are illustrative and do not depict the production product.</text>
</g>

<text x="16" y="26" class="t16">02 Research plan and instruments</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: How did we learn how engagement teams work, with what methods, what rigor and what limits?</tspan></text>
<text x="16" y="66" class="t11 ink2">Feeds: D-02  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="756" y="22">I decided: The method mix, the sampling frame per method and contextual inquiry as the anchor. That</tspan><tspan x="756" y="35">every count beyond the dry run is labeled a planned target.</tspan></text>
<text class="t11 ink2"><tspan x="756" y="56">We built: The instruments, the recruiting screeners and the SME session series. Fieldwork and coding</tspan><tspan x="756" y="69">were team work.</tspan></text>
<text x="16" y="116" class="t11 ink2 b">METHOD MAP: WHAT RAN WHEN, WHICH QUESTION IT ANSWERS AND HOW BIG IT WAS PLANNED TO BE</text>

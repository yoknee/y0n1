<g class="svg-head" data-h="106">
<rect x="0" y="0" width="1400" height="106" class="surf2"/><line x1="0" y1="106" x2="1400" y2="106" class="hair"/>
<text x="16" y="26" class="t16">03 Research synthesis</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: What did the research find, how strong is each finding and which decisions did it drive?</tspan></text>
<text x="16" y="66" class="t11 ink2">Feeds: D-03, D-04, D-06  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="756" y="22">I decided: the codebook structure, the ordinal evidence rubric instead of tallies and which themes</tspan><tspan x="756" y="35">became decisions.</tspan></text>
<text class="t11 ink2"><tspan x="756" y="56">We built: the coding, two coders per source, the affinity sessions and the evidence table. Design</tspan><tspan x="756" y="69">team of three at this phase. Theme names were argued out in the weekly coding review.</tspan></text>
<text x="16" y="100" class="t10 ink2">Reconstructed for portfolio purposes. The process, decisions and role are real. Screens, data, names and figures are illustrative and do not depict the production product.</text>
</g>

<title id="t">05 Current-state journey map and service blueprint</title>
<desc id="d">What does one Test of Details feel like today, stage by stage, what happens behind the auditor and what changes when agents join? Decisions fed: D-09. Status: Draft. Reconstructed for portfolio purposes; illustrative.</desc>


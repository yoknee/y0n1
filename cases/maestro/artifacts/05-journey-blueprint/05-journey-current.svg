<circle cx="1315.4444444444446" cy="221" r="4" class="failed"/><text x="1315.4444444444446" y="235" class="t10 ink2" text-anchor="middle">uneasy</text>
<line x1="16" y1="322" x2="1384" y2="322" class="hair"/>
<text class="t11 ink2 b"><tspan x="16" y="264">DOING</tspan></text>
<line x1="150" y1="248" x2="150" y2="322" class="hair"/>
<text class="t11"><tspan x="156" y="264">Scope the area. Pick</tspan><tspan x="156" y="277">procedures from the</tspan><tspan x="156" y="290">methodology. Set</tspan><tspan x="156" y="303">sample sizes.</tspan></text>
<line x1="287.1111111111111" y1="248" x2="287.1111111111111" y2="322" class="hair"/>
<text class="t11"><tspan x="293.1111111111111" y="264">Rate assertions by</tspan><tspan x="293.1111111111111" y="277">risk with the manager.</tspan><tspan x="293.1111111111111" y="290">Set thresholds.</tspan></text>
<line x1="424.22222222222223" y1="248" x2="424.22222222222223" y2="322" class="hair"/>
<text class="t11"><tspan x="430.22222222222223" y="264">Pick the Test of</tspan><tspan x="430.22222222222223" y="277">Details structure.</tspan><tspan x="430.22222222222223" y="290">Define population and</tspan><tspan x="430.22222222222223" y="303">sample method.</tspan></text>
<line x1="561.3333333333334" y1="248" x2="561.3333333333334" y2="322" class="hair"/>
<text class="t11"><tspan x="567.3333333333334" y="264">Raise client requests.</tspan><tspan x="567.3333333333334" y="277">Chase. Open three</tspan><tspan x="567.3333333333334" y="290">systems to find one</tspan><tspan x="567.3333333333334" y="303">document.</tspan></text>
<line x1="698.4444444444445" y1="248" x2="698.4444444444445" y2="322" class="hair"/>
<text class="t11"><tspan x="704.4444444444445" y="264">Trace each sampled</tspan><tspan x="704.4444444444445" y="277">item field by field.</tspan><tspan x="704.4444444444445" y="290">Record results.</tspan></text>
<line x1="835.5555555555555" y1="248" x2="835.5555555555555" y2="322" class="hair"/>
<text class="t11"><tspan x="841.5555555555555" y="264">Investigate</tspan><tspan x="841.5555555555555" y="277">differences. Call the</tspan><tspan x="841.5555555555555" y="290">client. Document.</tspan></text>
<line x1="972.6666666666667" y1="248" x2="972.6666666666667" y2="322" class="hair"/>
<text class="t11"><tspan x="978.6666666666667" y="264">Draft the conclusion.</tspan><tspan x="978.6666666666667" y="277">Link references.</tspan></text>
<line x1="1109.7777777777778" y1="248" x2="1109.7777777777778" y2="322" class="hair"/>
<text class="t11"><tspan x="1115.7777777777778" y="264">Wait. Clear notes.</tspan><tspan x="1115.7777777777778" y="277">Clear them again.</tspan></text>
<line x1="1246.888888888889" y1="248" x2="1246.888888888889" y2="322" class="hair"/>
<text class="t11"><tspan x="1252.888888888889" y="264">Prepare the partner</tspan><tspan x="1252.888888888889" y="277">walkthrough.</tspan></text>
<line x1="16" y1="370" x2="1384" y2="370" class="hair"/>
<text class="t11 ink2 b"><tspan x="16" y="338">THINKING</tspan></text>
<line x1="150" y1="322" x2="150" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="156" y="338">&quot;Which structure fits</tspan><tspan x="156" y="351">this client this</tspan><tspan x="156" y="364">year?&quot;</tspan></text>
<line x1="287.1111111111111" y1="322" x2="287.1111111111111" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="293.1111111111111" y="338">&quot;Where did last year's</tspan><tspan x="293.1111111111111" y="351">exceptions come from?&quot;</tspan></text>
<line x1="424.22222222222223" y1="322" x2="424.22222222222223" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="430.22222222222223" y="338">&quot;Will the reviewer</tspan><tspan x="430.22222222222223" y="351">accept this</tspan><tspan x="430.22222222222223" y="364">structure?&quot;</tspan></text>
<line x1="561.3333333333334" y1="322" x2="561.3333333333334" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="567.3333333333334" y="338">&quot;Where is that</tspan><tspan x="567.3333333333334" y="351">statement? Is this the</tspan><tspan x="567.3333333333334" y="364">right version?&quot;</tspan></text>
<line x1="698.4444444444445" y1="322" x2="698.4444444444445" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="704.4444444444445" y="338">&quot;Same five fields,</tspan><tspan x="704.4444444444445" y="351">item after item.&quot;</tspan></text>
<line x1="835.5555555555555" y1="322" x2="835.5555555555555" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="841.5555555555555" y="338">&quot;Is this a</tspan><tspan x="841.5555555555555" y="351">misstatement or an</tspan><tspan x="841.5555555555555" y="364">explanation?&quot;</tspan></text>
<line x1="972.6666666666667" y1="322" x2="972.6666666666667" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="978.6666666666667" y="338">&quot;What wording survives</tspan><tspan x="978.6666666666667" y="351">review?&quot;</tspan></text>
<line x1="1109.7777777777778" y1="322" x2="1109.7777777777778" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="1115.7777777777778" y="338">&quot;Why is this note</tspan><tspan x="1115.7777777777778" y="351">back?&quot;</tspan></text>
<line x1="1246.888888888889" y1="322" x2="1246.888888888889" y2="370" class="hair"/>
<text class="t11 ink2"><tspan x="1252.888888888889" y="338">&quot;Will she ask for the</tspan><tspan x="1252.888888888889" y="351">exception trail?&quot;</tspan></text>
<rect x="16" y="370" width="1368" height="86" class="surf2" opacity="0.6"/>
<line x1="16" y1="456" x2="1384" y2="456" class="hair"/>
<text class="t11 ink2 b"><tspan x="16" y="386">PAIN</tspan></text>
<line x1="150" y1="370" x2="150" y2="456" class="hair"/>
<text class="t11"><tspan x="156" y="386">Structures adapted by</tspan><tspan x="156" y="399">hand before work</tspan><tspan x="156" y="412">starts (T13).</tspan></text>
<line x1="287.1111111111111" y1="370" x2="287.1111111111111" y2="456" class="hair"/>
<text class="t11"><tspan x="293.1111111111111" y="386">Prior-year context</tspan><tspan x="293.1111111111111" y="399">lives in people, not</tspan><tspan x="293.1111111111111" y="412">the file (T11).</tspan></text>
<line x1="424.22222222222223" y1="370" x2="424.22222222222223" y2="456" class="hair"/>
<text class="t11"><tspan x="430.22222222222223" y="386">Local variants cause</tspan><tspan x="430.22222222222223" y="399">review notes later</tspan><tspan x="430.22222222222223" y="412">(T13, T10).</tspan></text>
<line x1="561.3333333333334" y1="370" x2="561.3333333333334" y2="456" class="hair"/>
<text class="t11"><tspan x="567.3333333333334" y="386">Locating costs more</tspan><tspan x="567.3333333333334" y="399">than judging (T1).</tspan><tspan x="567.3333333333334" y="412">Data limits known</tspan><tspan x="567.3333333333334" y="425">unevenly (T9).</tspan></text>
<line x1="698.4444444444445" y1="370" x2="698.4444444444445" y2="456" class="hair"/>
<text class="t11"><tspan x="704.4444444444445" y="386">The repetitive core</tspan><tspan x="704.4444444444445" y="399">(T2). Attention fades</tspan><tspan x="704.4444444444445" y="412">late. Interruptions</tspan><tspan x="704.4444444444445" y="425">restart the trace</tspan><tspan x="704.4444444444445" y="438">(T11).</tspan></text>
<line x1="835.5555555555555" y1="370" x2="835.5555555555555" y2="456" class="hair"/>
<text class="t11"><tspan x="841.5555555555555" y="386">Context assembled by</tspan><tspan x="841.5555555555555" y="399">hand before judgment</tspan><tspan x="841.5555555555555" y="412">can start (T6).</tspan></text>
<line x1="972.6666666666667" y1="370" x2="972.6666666666667" y2="456" class="hair"/>
<text class="t11"><tspan x="978.6666666666667" y="386">Rework originates in</tspan><tspan x="978.6666666666667" y="399">references and wording</tspan><tspan x="978.6666666666667" y="412">(T4).</tspan></text>
<line x1="1109.7777777777778" y1="370" x2="1109.7777777777778" y2="456" class="hair"/>
<text class="t11"><tspan x="1115.7777777777778" y="386">Latency compounds</tspan><tspan x="1115.7777777777778" y="399">(T5). Reviewer decodes</tspan><tspan x="1115.7777777777778" y="412">format before</tspan><tspan x="1115.7777777777778" y="425">substance (T10).</tspan><tspan x="1115.7777777777778" y="438">Source first (T3).</tspan></text>
<line x1="1246.888888888889" y1="370" x2="1246.888888888889" y2="456" class="hair"/>
<text class="t11"><tspan x="1252.888888888889" y="386">If it is wrong, it is</tspan><tspan x="1252.888888888889" y="399">my name (T8, E-13).</tspan><tspan x="1252.888888888889" y="412">The trail is spread</tspan><tspan x="1252.888888888889" y="425">across workpapers and</tspan><tspan x="1252.888888888889" y="438">emails (T8, E-23).</tspan></text>
<line x1="16" y1="516" x2="1384" y2="516" class="hair"/>
<text class="t11 ink2 b"><tspan x="16" y="472">OPPORTUNITY</tspan></text>
<line x1="150" y1="456" x2="150" y2="516" class="hair"/>
<text class="t11"><tspan x="156" y="472">Plan against a typed</tspan><tspan x="156" y="485">structure from the</tspan><tspan x="156" y="498">library.</tspan></text>
<line x1="287.1111111111111" y1="456" x2="287.1111111111111" y2="516" class="hair"/>
<text class="t11"><tspan x="293.1111111111111" y="472">Prior-year exceptions</tspan><tspan x="293.1111111111111" y="485">surfaced per</tspan><tspan x="293.1111111111111" y="498">assertion.</tspan></text>
<line x1="424.22222222222223" y1="456" x2="424.22222222222223" y2="516" class="hair"/>
<text class="t11"><tspan x="430.22222222222223" y="472">A library with fit</tspan><tspan x="430.22222222222223" y="485">rules; no in-place</tspan><tspan x="430.22222222222223" y="498">edits.</tspan></text>
<line x1="561.3333333333334" y1="456" x2="561.3333333333334" y2="516" class="hair"/>
<text class="t11"><tspan x="567.3333333333334" y="472">Agent retrieval within</tspan><tspan x="567.3333333333334" y="485">data classes, with a</tspan><tspan x="567.3333333333334" y="498">record of what was</tspan><tspan x="567.3333333333334" y="511">read.</tspan></text>
<line x1="698.4444444444445" y1="456" x2="698.4444444444445" y2="516" class="hair"/>
<text class="t11"><tspan x="704.4444444444445" y="472">Agent extraction and</tspan><tspan x="704.4444444444445" y="485">matching. Auditor on</tspan><tspan x="704.4444444444445" y="498">the differences.</tspan></text>
<line x1="835.5555555555555" y1="456" x2="835.5555555555555" y2="516" class="hair"/>
<text class="t11"><tspan x="841.5555555555555" y="472">An exception workbench</tspan><tspan x="841.5555555555555" y="485">with evidence</tspan><tspan x="841.5555555555555" y="498">attached.</tspan></text>
<line x1="972.6666666666667" y1="456" x2="972.6666666666667" y2="516" class="hair"/>
<text class="t11"><tspan x="978.6666666666667" y="472">Draft with references</tspan><tspan x="978.6666666666667" y="485">in place. Edits</tspan><tspan x="978.6666666666667" y="498">recorded as a diff.</tspan></text>
<line x1="1109.7777777777778" y1="456" x2="1109.7777777777778" y2="516" class="hair"/>
<text class="t11"><tspan x="1115.7777777777778" y="472">A review center with</tspan><tspan x="1115.7777777777778" y="485">state and provenance</tspan><tspan x="1115.7777777777778" y="498">in view.</tspan></text>
<line x1="1246.888888888889" y1="456" x2="1246.888888888889" y2="516" class="hair"/>
<text class="t11"><tspan x="1252.888888888889" y="472">Exception trail and</tspan><tspan x="1252.888888888889" y="485">checkpoint record in</tspan><tspan x="1252.888888888889" y="498">the file.</tspan></text>
<text x="16" y="534" class="t11 ink2">Reconstructed from the themes in 03. Emotion values are my reading of the evidence on a five-point scale, not a measurement. Future-state feeling is design intent.</text>
</svg>
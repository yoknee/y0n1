<rect x="0" y="0" width="1400" height="92" class="surf2"/><line x1="0" y1="92" x2="1400" y2="92" class="hair"/>
<text x="16" y="26" class="t16">05 Current-state journey map and service blueprint</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: What does one Test of Details feel like today, stage by stage, what happens behind the auditor and what</tspan><tspan x="16" y="58">changes when agents join?</tspan></text>
<text x="16" y="78" class="t11 ink2">Feeds: D-09  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="756" y="22">I decided: To map one Test of Details through the Senior's eyes, to put the emotion curve where the</tspan><tspan x="756" y="35">deadline bites and to place the mandatory checkpoints where judgment lives.</tspan></text>
<text class="t11 ink2"><tspan x="756" y="56">We built: The maps in two workshop sessions with the design team and the methodology reviewer role;</tspan><tspan x="756" y="69">the backstage rows with the engagement data lead role.</tspan></text>
<text x="16" y="116" class="t11 ink2 b">CURRENT-STATE JOURNEY. LENS: ENGAGEMENT SENIOR (DANA WHITLOCK, P1) RUNNING ONE TEST OF DETAILS ON REVENUE. MANAGER AND PARTNER ENTER AT REVIEW AND SIGN.</text>
<rect x="150" y="126" width="1234" height="24" class="surf2"/>
<text x="218.55555555555554" y="142" class="t11 b" text-anchor="middle">Plan</text><line x1="150" y1="126" x2="150" y2="150" class="hair"/>
<text x="355.66666666666663" y="142" class="t11 b" text-anchor="middle">Assess risk</text><line x1="287.1111111111111" y1="126" x2="287.1111111111111" y2="150" class="hair"/>
<text x="492.77777777777777" y="142" class="t11 b" text-anchor="middle">Design procedures</text><line x1="424.22222222222223" y1="126" x2="424.22222222222223" y2="150" class="hair"/>
<text x="629.8888888888889" y="142" class="t11 b" text-anchor="middle">Gather evidence</text><line x1="561.3333333333334" y1="126" x2="561.3333333333334" y2="150" class="hair"/>
<text x="767" y="142" class="t11 b" text-anchor="middle">Test</text><line x1="698.4444444444445" y1="126" x2="698.4444444444445" y2="150" class="hair"/>
<text x="904.1111111111111" y="142" class="t11 b" text-anchor="middle">Evaluate exceptions</text><line x1="835.5555555555555" y1="126" x2="835.5555555555555" y2="150" class="hair"/>
<text x="1041.2222222222224" y="142" class="t11 b" text-anchor="middle">Conclude</text><line x1="972.6666666666667" y1="126" x2="972.6666666666667" y2="150" class="hair"/>
<text x="1178.3333333333335" y="142" class="t11 b" text-anchor="middle">Review</text><line x1="1109.7777777777778" y1="126" x2="1109.7777777777778" y2="150" class="hair"/>
<text x="1315.4444444444446" y="142" class="t11 b" text-anchor="middle">Sign</text><line x1="1246.888888888889" y1="126" x2="1246.888888888889" y2="150" class="hair"/>
<text class="t11 ink2 b"><tspan x="16" y="168">FEELING</tspan><tspan x="16" y="180">(RECONSTRUCTED)</tspan></text>
<line x1="150" y1="217" x2="1384" y2="217" class="hair" stroke-dasharray="2 3"/><text x="144" y="221" class="t10 ink3" text-anchor="end">-2</text>
<line x1="150" y1="189" x2="1384" y2="189" class="hair" /><text x="144" y="193" class="t10 ink3" text-anchor="end">0</text>
<line x1="150" y1="161" x2="1384" y2="161" class="hair" stroke-dasharray="2 3"/><text x="144" y="165" class="t10 ink3" text-anchor="end">+2</text>
<polyline points="218.55555555555554,189 355.66666666666663,189 492.77777777777777,189 629.8888888888889,203 767,217 904.1111111111111,203 1041.2222222222224,203 1178.3333333333335,217 1315.4444444444446,203" class="failed-s" stroke-width="2" />
<circle cx="218.55555555555554" cy="189" r="4" class="failed"/><text x="218.55555555555554" y="181" class="t10 ink2" text-anchor="middle">steady</text>
<circle cx="355.66666666666663" cy="189" r="4" class="failed"/><text x="355.66666666666663" y="181" class="t10 ink2" text-anchor="middle">steady</text>
<circle cx="492.77777777777777" cy="189" r="4" class="failed"/><text x="492.77777777777777" y="181" class="t10 ink2" text-anchor="middle">steady</text>
<circle cx="629.8888888888889" cy="203" r="4" class="failed"/><text x="629.8888888888889" y="217" class="t10 ink2" text-anchor="middle">uneasy</text>

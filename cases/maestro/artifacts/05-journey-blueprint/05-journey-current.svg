<g class="svg-head" data-h="110">
<rect x="0" y="0" width="1400" height="110" class="surf2"/><line x1="0" y1="110" x2="1400" y2="110" class="hair"/>
<text x="16" y="26" class="t16">05 Current-state journey map and service blueprint</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: What does one Test of Details feel like today, stage by stage, what happens behind the auditor and what</tspan><tspan x="16" y="58">changes when agents join?</tspan></text>
<text x="16" y="78" class="t11 ink2">Feeds: D-09  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="756" y="22">I decided: to map one Test of Details through the Senior's eyes, to put the emotion curve where the</tspan><tspan x="756" y="35">deadline bites and to place the mandatory checkpoints where judgment lives.</tspan></text>
<text class="t11 ink2"><tspan x="756" y="56">We built: the maps in two workshop sessions with the design team and the methodology reviewer role;</tspan><tspan x="756" y="69">the backstage rows with the engagement data lead role. Design team of three at this phase.</tspan></text>
<text x="16" y="104" class="t10 ink2">Reconstructed for portfolio purposes. The process, decisions and role are real. Screens, data, names and figures are illustrative and do not depict the production product.</text>
</g>
<text x="16" y="134" class="t11 ink2 b">CURRENT-STATE JOURNEY. LENS: ENGAGEMENT SENIOR (DANA WHITLOCK, P1) RUNNING ONE TEST OF DETAILS ON REVENUE. MANAGER AND PARTNER ENTER AT REVIEW AND SIGN.</text>
<rect x="150" y="144" width="1234" height="24" class="surf2"/>
<text x="218.55555555555554" y="160" class="t11 b" text-anchor="middle">Plan</text><line x1="150" y1="144" x2="150" y2="168" class="hair"/>
<text x="355.66666666666663" y="160" class="t11 b" text-anchor="middle">Assess risk</text><line x1="287.1111111111111" y1="144" x2="287.1111111111111" y2="168" class="hair"/>
<text x="492.77777777777777" y="160" class="t11 b" text-anchor="middle">Design procedures</text><line x1="424.22222222222223" y1="144" x2="424.22222222222223" y2="168" class="hair"/>
<text x="629.8888888888889" y="160" class="t11 b" text-anchor="middle">Gather evidence</text><line x1="561.3333333333334" y1="144" x2="561.3333333333334" y2="168" class="hair"/>
<text x="767" y="160" class="t11 b" text-anchor="middle">Test</text><line x1="698.4444444444445" y1="144" x2="698.4444444444445" y2="168" class="hair"/>
<text x="904.1111111111111" y="160" class="t11 b" text-anchor="middle">Evaluate exceptions</text><line x1="835.5555555555555" y1="144" x2="835.5555555555555" y2="168" class="hair"/>
<text x="1041.2222222222224" y="160" class="t11 b" text-anchor="middle">Conclude</text><line x1="972.6666666666667" y1="144" x2="972.6666666666667" y2="168" class="hair"/>
<text x="1178.3333333333335" y="160" class="t11 b" text-anchor="middle">Review</text><line x1="1109.7777777777778" y1="144" x2="1109.7777777777778" y2="168" class="hair"/>
<text x="1315.4444444444446" y="160" class="t11 b" text-anchor="middle">Sign</text><line x1="1246.888888888889" y1="144" x2="1246.888888888889" y2="168" class="hair"/>
<text class="t11 ink2 b"><tspan x="16" y="186">FEELING</tspan><tspan x="16" y="198">(RECONSTRUCTED)</tspan></text>
<line x1="150" y1="235" x2="1384" y2="235" class="hair" stroke-dasharray="2 3"/><text x="144" y="239" class="t10 ink3" text-anchor="end">-2</text>
<line x1="150" y1="207" x2="1384" y2="207" class="hair" /><text x="144" y="211" class="t10 ink3" text-anchor="end">0</text>
<line x1="150" y1="179" x2="1384" y2="179" class="hair" stroke-dasharray="2 3"/><text x="144" y="183" class="t10 ink3" text-anchor="end">+2</text>
<polyline points="218.55555555555554,207 355.66666666666663,207 492.77777777777777,207 629.8888888888889,221 767,235 904.1111111111111,221 1041.2222222222224,221 1178.3333333333335,235 1315.4444444444446,221" class="failed-s" stroke-width="2" />
<circle cx="218.55555555555554" cy="207" r="4" class="failed"/><text x="218.55555555555554" y="199" class="t10 ink2" text-anchor="middle">steady</text>
<circle cx="355.66666666666663" cy="207" r="4" class="failed"/><text x="355.66666666666663" y="199" class="t10 ink2" text-anchor="middle">steady</text>
<circle cx="492.77777777777777" cy="207" r="4" class="failed"/><text x="492.77777777777777" y="199" class="t10 ink2" text-anchor="middle">steady</text>

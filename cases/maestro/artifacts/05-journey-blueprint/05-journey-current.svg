<title id="t-05-current">05 Current-state journey map and service blueprint</title>
<desc id="d-05-current">What does one Test of Details feel like today, stage by stage, what happens behind the auditor and what changes when agents join? Decisions fed: D-09. Status: Draft. Reconstructed for portfolio purposes. The process, decisions and role are real. Screens, data, names and figures are illustrative and do not depict the production product.</desc>


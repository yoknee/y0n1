<text x="640" y="708" class="t10 ink2 b">ANCHORS</text>
<text class="t10 ink2"><tspan x="640" y="722">Value 5: removes a high-consistency theme's pain for every role. 3: removes pain for one role or one stage. 1:</tspan><tspan x="640" y="734">nice to have, no theme behind it.</tspan></text>
<text class="t10 ink2"><tspan x="640" y="748">Feasibility 5: buildable with the design system as is. 3: needs one new pattern or a methodology ruling. 1:</tspan><tspan x="640" y="760">blocked by a constraint in 01 until a dependency ships.</tspan></text>
<text class="t10 ink2"><tspan x="640" y="774">I scored; PMs and engineering leads contested; half points mark where a rating moved (table on the page).</tspan></text>
<text class="t11 ink2"><tspan x="16" y="800">Reconstructed. Value and feasibility ratings are my judgment under the constraints in 01, argued with PMs and engineering leads and recorded in half points. They are not</tspan><tspan x="16" y="814">measured. Value drew the MVP line; feasibility set the sequence. Feasibility reflects C1 to C7: a solution that needs the permission model or an independence review</tspan><tspan x="16" y="828">before it can ship rates low until that exists.</tspan></text>

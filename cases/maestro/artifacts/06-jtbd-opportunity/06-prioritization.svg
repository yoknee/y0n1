<text x="16" y="706" class="t11 ink2">Reconstructed. Value and feasibility ratings are the lead's judgment under the constraints in 01, argued with PMs and engineering leads. They are not measured. Feasibility reflects C1 to C7: a solution that needs the permission model or an independence review before it can ship rates low until that exists.</text>

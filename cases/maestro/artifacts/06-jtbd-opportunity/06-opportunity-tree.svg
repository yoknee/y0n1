<text class="t11"><tspan x="568" y="292">Extraction and matching against a typed structure,</tspan><tspan x="568" y="305">differences first</tspan></text>
<text class="t10 ink2"><tspan x="980" y="275">Time-and-motion step durations before and after; error count per</tspan><tspan x="980" y="287">sample in usability round 2</tspan></text>

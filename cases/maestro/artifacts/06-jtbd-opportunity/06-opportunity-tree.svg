<text x="16" y="26" class="t16">06 Jobs to be done and opportunity map</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: What are auditors trying to get done, which opportunities follow from the findings and what did we cut for</tspan><tspan x="16" y="58">MVP and why?</tspan></text>
<text x="16" y="78" class="t11 ink2">Feeds: D-10, D-11  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="756" y="22">I decided: The outcome statement, the cut line for MVP and Test of Details as the anchor workflow.</tspan></text>
<text class="t11 ink2"><tspan x="756" y="43">We built: The job statements from the coded material, the tree in two working sessions with PMs and</tspan><tspan x="756" y="56">the feasibility ratings with the engineering leads.</tspan></text>
<text x="16" y="116" class="t11 ink2 b">OPPORTUNITY SOLUTION TREE: OUTCOME TO OPPORTUNITIES TO SOLUTIONS TO EXPERIMENTS. SOLUTION STATE: MVP, CUT OR LATER.</text>
<text x="16" y="138" class="t10 ink2 b">OUTCOME</text>
<text x="250" y="138" class="t10 ink2 b">OPPORTUNITY</text>
<text x="560" y="138" class="t10 ink2 b">SOLUTION</text>
<text x="980" y="138" class="t10 ink2 b">EXPERIMENT</text>
<rect x="560" y="148" width="380" height="40" rx="3" class="surf" stroke="var(--bt-brand)" stroke-width="1.5" />
<text x="568" y="163" class="t10 mono ink2">S1</text><rect x="894" y="153" width="40" height="14" rx="7" class="brand-t"/><text x="914" y="163" class="t10" text-anchor="middle">MVP</text>
<text class="t11"><tspan x="568" y="177">Agent retrieval within data classes, with a log of what</tspan><tspan x="568" y="189">was read</tspan></text>
<text class="t10 ink2"><tspan x="980" y="161">Pilot telemetry: time from request to evidence in hand; usability</tspan><tspan x="980" y="173">task 'find what the agent read'</tspan></text>

<text class="t11"><tspan x="568" y="406">Citation chip on every claim that opens the source at</tspan><tspan x="568" y="419">the span</tspan></text>
<text class="t10 ink2"><tspan x="980" y="389">Usability task: find the source for a claim, time and success</tspan></text>

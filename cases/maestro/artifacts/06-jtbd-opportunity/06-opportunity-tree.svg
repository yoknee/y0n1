<desc id="d-06-tree">What are auditors trying to get done, which opportunities follow from the findings and what did we cut for MVP and why? Decisions fed: D-10, D-11. Status: Draft. Reconstructed for portfolio purposes. The process, decisions and role are real. Screens, data, names and figures are illustrative and do not depict the production product.</desc>


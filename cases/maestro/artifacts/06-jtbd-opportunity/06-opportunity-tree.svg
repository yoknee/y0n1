<rect x="560" y="540" width="380" height="40" rx="3" class="surf" stroke="var(--bt-brand)" stroke-width="1.5" />
<text x="568" y="555" class="t10 mono ink2">S9</text><rect x="894" y="545" width="40" height="14" rx="7" class="brand-t"/><text x="914" y="555" class="t10" text-anchor="middle">MVP</text>

<title id="t-01-constraints">01 Problem framing and constraints map</title>
<desc id="d-01-constraints">What is the design problem, what breaks for auditors today and what can the design not change? Decisions fed: D-01, D-05. Status: Draft. Reconstructed for portfolio purposes. The process, decisions and role are real. Screens, data, names and figures are illustrative and do not depict the production product.</desc>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 828" width="1400" height="828" role="img" aria-labelledby="t d">
<title id="t">01 Problem framing and constraints map</title>
<desc id="d">What is the design problem, what breaks for auditors today and what can the design not change? Decisions fed: D-01, D-05. Status: Draft. Reconstructed for portfolio purposes; illustrative.</desc>


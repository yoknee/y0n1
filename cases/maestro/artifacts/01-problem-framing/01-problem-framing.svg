<rect x="0" y="0" width="1400" height="72" class="surf2"/><line x1="0" y1="72" x2="1400" y2="72" class="hair"/>
<text x="16" y="26" class="t16">01 Problem framing and constraints map</text>
<text class="t11 ink2"><tspan x="16" y="46">Question: What is the design problem, what breaks for auditors today and what can the design not change?</tspan></text>
<text x="16" y="66" class="t11 ink2">Feeds: D-01, D-05  |  Status: Draft</text>
<text class="t11 ink2"><tspan x="760" y="22">I decided: To frame the problem as the boundary between agent and auditor, not as adding AI to the</tspan><tspan x="760" y="35">workpaper. The triad table as the shared artifact PMs and engineering leads plan against.</tspan></text>
<text class="t11 ink2"><tspan x="760" y="50">We built: The constraint list with methodology reviewers, the engagement data lead role and</tspan><tspan x="760" y="63">engineering leads. The data classes in C3 were drafted with the data lead.</tspan></text>
<text x="16" y="100" class="t11 ink2 b">USER PROBLEM</text>
<rect x="16" y="108" width="333" height="86" rx="3" class="surf" stroke="var(--bt-border)"/>
<text x="26" y="128" class="b">Fragmented tools</text>
<text class="t11 ink2"><tspan x="26" y="146">Evidence, workpapers, client requests and review live in</tspan><tspan x="26" y="160">separate systems. The auditor reassembles the picture by</tspan><tspan x="26" y="174">hand for every sample.</tspan></text>
<rect x="361" y="108" width="333" height="86" rx="3" class="surf" stroke="var(--bt-border)"/>
<text x="371" y="128" class="b">Manual evidence review</text>
<text class="t11 ink2"><tspan x="371" y="146">Each sampled item is traced to its documents one at a</tspan><tspan x="371" y="160">time. The work is repetitive and the volume peaks when</tspan><tspan x="371" y="174">time is shortest.</tspan></text>
<rect x="706" y="108" width="333" height="86" rx="3" class="surf" stroke="var(--bt-border)"/>
<text x="716" y="128" class="b">Inconsistent workpapers</text>
<text class="t11 ink2"><tspan x="716" y="146">Each team formats workpapers its own way. Reviewers decode</tspan><tspan x="716" y="160">the format before they can judge the substance.</tspan></text>
<rect x="1051" y="108" width="333" height="86" rx="3" class="surf" stroke="var(--bt-border)"/>
<text x="1061" y="128" class="b">Deadline pressure</text>
<text class="t11 ink2"><tspan x="1061" y="146">Busy season concentrates all of the above into a few</tspan><tspan x="1061" y="160">weeks. Shortcuts taken under pressure are the quality risk</tspan><tspan x="1061" y="174">the platform exists to remove.</tspan></text>
<text x="16" y="218" class="t11 ink2 b">BUSINESS OBJECTIVE</text>
<rect x="16" y="226" width="440" height="104" rx="3" class="surf" stroke="var(--bt-border)"/>
<text><tspan x="26" y="248">An AI-native audit platform that keeps auditors accountable.</tspan><tspan x="26" y="264">Agents do the research and analysis. Auditors stay accountable for</tspan><tspan x="26" y="280">the conclusion.</tspan></text>
<path d="M464 278 h40 m-8 -6 l8 6 l-8 6" class="stroke2" stroke-width="1.5"/>
<text x="516" y="218" class="t11 ink2 b">THE DESIGN PROBLEM: THE BOUNDARY</text>
<rect x="516" y="226" width="868" height="104" rx="3" class="brand-t" stroke="var(--bt-brand)"/>
<text><tspan x="526" y="246">The design problem is the boundary between agent and auditor: what the agent may access,</tspan><tspan x="526" y="261">where a human must review, how the auditor sees what the agent did and what the system does</tspan><tspan x="526" y="276">when the agent is wrong.</tspan></text>
<text x="526" y="302" class="t11 b">Q1 What may the agent access?</text>
<text x="956" y="302" class="t11 b">Q2 Where must a human review?</text>
<text x="526" y="318" class="t11 b">Q3 How does the auditor see what the agent did?</text>
<text x="956" y="318" class="t11 b">Q4 What happens when the agent is wrong?</text>
<text x="16" y="358" class="t11 ink2 b">CONSTRAINTS MAP: WHICH BOUNDARY QUESTION EACH CONSTRAINT SHAPES, AND THE DESIGN IMPLICATION</text>
<rect x="16" y="370" width="1368" height="26" class="surf2"/>
<text x="16" y="387" class="t11 ink2">ID</text><text x="56" y="387" class="t11 ink2">Constraint</text><text x="300" y="387" class="t11 ink2">Design implication</text>
<text x="932" y="387" class="t11 ink2 mono" text-anchor="middle">Q1</text>
<text x="976" y="387" class="t11 ink2 mono" text-anchor="middle">Q2</text>
<text x="1020" y="387" class="t11 ink2 mono" text-anchor="middle">Q3</text>
<text x="1064" y="387" class="t11 ink2 mono" text-anchor="middle">Q4</text>
<text x="1120" y="387" class="t11 ink2">Shapes decisions</text>
<line x1="16" y1="450" x2="1384" y2="450" class="hair"/>
<text x="16" y="416" class="mono ink2">C1</text>
<text class="b"><tspan x="56" y="416">Auditing standards and documentation</tspan><tspan x="56" y="431">requirements</tspan></text>
<text class="t11"><tspan x="300" y="415">Provenance is a first-class object in the UI. The agent timeline is part of the record a reviewer</tspan><tspan x="300" y="429">reads, not a debug view.</tspan></text>
<line x1="928" y1="423" x2="936" y2="423" class="hair"/>
<line x1="972" y1="423" x2="980" y2="423" class="hair"/>
<rect x="1014" y="417" width="12" height="12" rx="2" class="brand"><title>C1 shapes Q3 How does the auditor see what the agent did?</title></rect>
<line x1="1060" y1="423" x2="1068" y2="423" class="hair"/>
<rect x="1120" y="413" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="427" class="t11 mono" text-anchor="middle">D-01</text>
<rect x="1178" y="413" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1204" y="427" class="t11 mono" text-anchor="middle">D-03</text>
<line x1="16" y1="504" x2="1384" y2="504" class="hair"/>
<text x="16" y="470" class="mono ink2">C2</text>
<text class="b"><tspan x="56" y="470">Independence</tspan></text>
<text class="t11"><tspan x="300" y="469">Proposals look like drafts everywhere they appear. Sign-off is a human-only control with its own</tspan><tspan x="300" y="483">affordance and no shortcut.</tspan></text>
<line x1="928" y1="477" x2="936" y2="477" class="hair"/>
<rect x="970" y="471" width="12" height="12" rx="2" class="brand"><title>C2 shapes Q2 Where must a human review?</title></rect>
<line x1="1016" y1="477" x2="1024" y2="477" class="hair"/>
<line x1="1060" y1="477" x2="1068" y2="477" class="hair"/>
<rect x="1120" y="467" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="481" class="t11 mono" text-anchor="middle">D-05</text>
<line x1="16" y1="558" x2="1384" y2="558" class="hair"/>
<text x="16" y="524" class="mono ink2">C3</text>
<text class="b"><tspan x="56" y="524">Data security and access classes</tspan></text>
<text class="t11"><tspan x="300" y="523">The permission model is visible in the product. A checkpoint sits before any restricted retrieval</tspan><tspan x="300" y="537">and the auditor sees what was read.</tspan></text>
<rect x="926" y="525" width="12" height="12" rx="2" class="brand"><title>C3 shapes Q1 What may the agent access?</title></rect>
<rect x="970" y="525" width="12" height="12" rx="2" class="brand"><title>C3 shapes Q2 Where must a human review?</title></rect>
<line x1="1016" y1="531" x2="1024" y2="531" class="hair"/>
<line x1="1060" y1="531" x2="1068" y2="531" class="hair"/>
<rect x="1120" y="521" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="535" class="t11 mono" text-anchor="middle">D-05</text>
<rect x="1178" y="521" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1204" y="535" class="t11 mono" text-anchor="middle">D-09</text>
<line x1="16" y1="612" x2="1384" y2="612" class="hair"/>
<text x="16" y="578" class="mono ink2">C4</text>
<text class="b"><tspan x="56" y="578">Explainability</tspan></text>
<text class="t11"><tspan x="300" y="577">Every claim carries a citation that opens the source at the span. Confidence shows its basis.</tspan><tspan x="300" y="591">Failure states name the cause.</tspan></text>
<line x1="928" y1="585" x2="936" y2="585" class="hair"/>
<line x1="972" y1="585" x2="980" y2="585" class="hair"/>
<rect x="1014" y="579" width="12" height="12" rx="2" class="brand"><title>C4 shapes Q3 How does the auditor see what the agent did?</title></rect>
<rect x="1058" y="579" width="12" height="12" rx="2" class="brand"><title>C4 shapes Q4 What happens when the agent is wrong?</title></rect>
<rect x="1120" y="575" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="589" class="t11 mono" text-anchor="middle">D-03</text>
<rect x="1178" y="575" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1204" y="589" class="t11 mono" text-anchor="middle">D-08</text>
<rect x="1236" y="575" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1262" y="589" class="t11 mono" text-anchor="middle">D-12</text>
<line x1="16" y1="666" x2="1384" y2="666" class="hair"/>
<text x="16" y="632" class="mono ink2">C5</text>
<text class="b"><tspan x="56" y="632">10,000+ users across countries</tspan></text>
<text class="t11"><tspan x="300" y="631">Density and keyboard operation by default. One pattern library so six teams ship one product.</tspan><tspan x="300" y="645">Non-color encoding on every state and chart.</tspan></text>
<text x="998" y="643" class="t11 ink3" text-anchor="middle">framework</text>
<rect x="1120" y="629" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="643" class="t11 mono" text-anchor="middle">D-15</text>
<rect x="1178" y="629" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1204" y="643" class="t11 mono" text-anchor="middle">D-17</text>
<rect x="1236" y="629" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1262" y="643" class="t11 mono" text-anchor="middle">D-18</text>
<line x1="16" y1="720" x2="1384" y2="720" class="hair"/>
<text x="16" y="686" class="mono ink2">C6</text>
<text class="b"><tspan x="56" y="686">Legacy workpaper systems</tspan></text>
<text class="t11"><tspan x="300" y="685">The workspace keeps the engagement, area, procedure hierarchy auditors already know. Export to the</tspan><tspan x="300" y="699">workpaper format is one action.</tspan></text>
<text x="998" y="697" class="t11 ink3" text-anchor="middle">framework</text>
<rect x="1120" y="683" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="697" class="t11 mono" text-anchor="middle">D-06</text>
<line x1="16" y1="774" x2="1384" y2="774" class="hair"/>
<text x="16" y="740" class="mono ink2">C7</text>
<text class="b"><tspan x="56" y="740">Engineering capacity</tspan></text>
<text class="t11"><tspan x="300" y="739">The design system is the contract. MVP cuts are explicit and documented. One anchor workflow, Test</tspan><tspan x="300" y="753">of Details, proves the pattern before it scales.</tspan></text>
<text x="998" y="751" class="t11 ink3" text-anchor="middle">framework</text>
<rect x="1120" y="737" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1146" y="751" class="t11 mono" text-anchor="middle">D-10</text>
<rect x="1178" y="737" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1204" y="751" class="t11 mono" text-anchor="middle">D-11</text>
<rect x="1236" y="737" width="52" height="20" rx="3" class="surf" stroke="var(--bt-border)"/><text x="1262" y="751" class="t11 mono" text-anchor="middle">D-21</text>
<rect x="920" y="788" width="12" height="12" rx="2" class="brand"/><text x="938" y="798" class="t11 ink2">shapes this question</text>
<text x="1070" y="798" class="t11 ink2">framework: shapes the pattern library rather than one question.</text>
<text x="920" y="814" class="t11 ink2">Decision IDs beyond D-05 are assigned when their artifacts ship.</text>
</svg>